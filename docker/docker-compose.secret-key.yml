# Fresh pinned-release installations only. Keep this overlay on every command.
# Existing pinned deployments must preserve their historical effective key;
# see INSTALL_MANUAL.md before opting in. No image version change is required.
# Requires Docker Compose 2.24.4+ for !reset. Removing the inherited key lets
# env_file supply the saved value without consulting the invoking shell.
services:
  ai-shifu-api:
    environment:
      SECRET_KEY: !reset null
  ai-shifu-celery-worker:
    environment:
      SECRET_KEY: !reset null
  ai-shifu-celery-beat:
    environment:
      SECRET_KEY: !reset null
