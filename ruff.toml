# Repo-wide Ruff configuration (used by lefthook.yml and .github/workflows/lint.yml).
#
# The lint rule set is pinned explicitly. Ruff 0.16 broadened its built-in
# default rule selection, which would surface thousands of new violations
# across this repo; pinning keeps the enforced rule set stable and independent
# of the installed Ruff version. Widening the rule set is a deliberate
# decision, not a side effect of a version bump.
#
# How to read this file:
# - `select` lists whole linters or prefixes wherever the codebase already
#   satisfies every rule underneath. A rule is spelled out individually only
#   when its prefix would drag in rules that do have violations.
# - `ignore` carves the exceptions back out, one comment per reason.
# - Groups that stay off entirely are listed under "Deliberately not selected"
#   below, so the rationale survives the next Ruff upgrade.
#
# Deliberately not selected:
# - SLF001 / PLC0415 / PLR2004
#   (and D1xx, see the ignore block): thousands of violations each; enforcing
#   them is a codebase-wide project, not a lint config change.
# - ISC004: every hit is the deliberate long-string wrapping idiom inside
#   tuples/lists, not a missed comma. ISC001/ISC002 also conflict with the
#   formatter.
# - COM812: ruff lists it as conflicting with the formatter. Applying its
#   6k fixes adds magic trailing commas that make `ruff format` re-explode
#   every affected call and signature one argument per line -- a repo-wide
#   reflow with no correctness value.
# - BLE001 / S110 / S112: blind/except-pass handlers are deliberate fail-open
#   patterns here (moderation, logging, notification side channels).
# - C901 / PLR09xx: complexity and argument-count budgets that the existing
#   service and route modules exceed by design.
# - TD003 / FIX002: the remaining TODOs have no tracking issue to link, and
#   inventing one (or downgrading the comment) would hide real pending work.

# Matches the Python pinned by src/api/Dockerfile and the CI workflows.
target-version = "py311"

[lint]
select = [
    # --- Core correctness -------------------------------------------------
    "E",       # pycodestyle errors (E501 ignored below)
    "F",       # pyflakes
    "W",       # pycodestyle warnings
    "I",       # import sorting and grouping
    "B",       # flake8-bugbear
    "SIM",     # flake8-simplify
    "PIE",     # flake8-pie (redundant placeholders, dict kwargs, startswith)
    "RET",     # flake8-return (explicit, non-redundant return statements)
    "RSE",     # unnecessary parentheses on a raised exception
    "C4",      # comprehension and collection-literal simplifications
    "FLY",     # static str.join that should be an f-string
    "PERF",    # performance anti-patterns
    "FURB",    # refurb modernizations
    "PYI",     # flake8-pyi (Any in __eq__, int | float unions, ...)
    "Q",       # quote style, matching the formatter
    "FA",      # missing from __future__ import annotations
    "ICN",     # import naming conventions
    "INT",     # gettext calls with f-strings
    "SLOT",    # subclasses of str/tuple/namedtuple without __slots__
    # INP001 requires an __init__.py next to importable modules, so a package
    # is never an implicit namespace package. Files loaded by path rather than
    # imported (entrypoints, operator scripts, Alembic revisions, fixtures)
    # are exempt below.
    "INP",     # implicit namespace packages
    "YTT",     # sys.version checks that break on two-digit versions
    "EXE",     # shebang vs executable-bit consistency
    "ASYNC",   # blocking I/O / sleep / subprocess inside async functions
    # T100/T201/T203 ban debugger and `print`/`pprint` calls in shipped code,
    # where logging is the contract.
    # Developer scripts, the inventory tooling and the test suites are console
    # programs by design and are exempt below; the few remaining backend calls
    # are CLI or debug output and say so inline.
    "T",       # debugger / print calls
    "ERA001",  # commented-out code

    # --- Datetime / UTC contract -----------------------------------------
    # Almost complete. The repo's UTC contract (AGENTS.md) stores naive-UTC
    # datetimes, so the sanctioned naive constructors are centralized in
    # `flaskr/util/datetime.py` -- `now_utc()` for "now", `parse_naive_utc()`
    # for inbound strings, `NAIVE_DATETIME_MIN/MAX` for sort sentinels -- and
    # everything else is enforced: the calls whose result depends on the
    # process time zone (now()/today()/utcnow()/fromtimestamp() without tz)
    # plus DTZ007/DTZ901, which now only pass through that one module. DTZ001
    # stays ignored below: naive `datetime(...)` literals are the storage
    # format itself.
    "DTZ",

    # --- Logging ----------------------------------------------------------
    # Logging calls pass values as positional interpolation arguments so message
    # rendering stays lazy. The group also catches real defects: G001/G003
    # format the message eagerly (and `+` can raise TypeError on non-string
    # values), G201 replaces `.error(..., exc_info=True)` with the equivalent
    # `.exception(...)`, and G202 drops `exc_info` arguments that already match
    # the call's default.
    "G",
    "LOG",     # flake8-logging (exc_info must name the exception outside except blocks)
    "TRY",     # complete flake8-raise family; clean on the current baseline
    # Build exception text immediately before raising it. Naming the message
    # keeps the source line in the traceback concise without changing the
    # exception type, rendered text, remaining arguments, or cause chain.
    "EM",      # flake8-errmsg (literal, f-string, and `.format()` messages)

    # --- Pylint subsets ---------------------------------------------------
    "PLE",     # pylint errors (yield/return in __init__, invalid dunders, ...)
    "PLC",     # pylint conventions (PLC0415 ignored below)
    "PLW",     # pylint warnings
    # PLR is partial: the complexity/magic-value members have thousands of
    # violations, so only the mechanical ones are listed.
    "PLR01",   # comparison with itself / of two constants
    "PLR0206", # property with parameters
    "PLR0402", # import module.member as member that should be from-import
    "PLR1",    # useless return, repeated comparison, manual min()/max()
    "PLR2044", # empty comment
    "PLR5",    # else: if ... that should be elif

    # --- Pytest -----------------------------------------------------------
    "PT",      # flake8-pytest-style

    # --- Paths, suppressions, shadowing, security -------------------------
    "PTH",     # os.path calls that should use pathlib
    "PGH",     # blanket noqa / type: ignore, invalid suppressions
    # Remove unused callable parameters when the repository owns the complete
    # signature. Preserve framework, protocol, fixture, and test-double keyword
    # names and consume them explicitly. Promote fixed keyword-compatible
    # lambdas to named functions; use **_kwargs only for intentionally open,
    # ignored keyword sets instead of renaming parameters callers still use.
    "ARG",     # flake8-unused-arguments
    "A",       # complete flake8-builtins family; clean on the current baseline
    # pep8-naming is enabled as a whole. Beyond the members the repo already
    # satisfied (N801-N803, N806, N813, N818), the group adds naming checks with
    # no current violations: the first argument of a method/classmethod/
    # metaclass method (N804/N805/N807), import aliases that change a name's
    # case (N811/N812/N814/N817), global mixedCase (N816) and non-importable
    # module filenames (N999). The two DTO modules whose camelCase fields ARE
    # the serialized JSON keys the frontend reads stay exempt from N815 below.
    "N",
    # The TID family bans reaching into a parent package with `from ..x import
    # y`, which hides which package a name really comes from; sibling-local
    # `from .x` imports stay allowed. The boundary-checker fixture below must
    # keep its parent-relative imports, since detecting them is what it tests.
    "TID",     # complete flake8-tidy-imports family; clean on the baseline
    "TD002",   # TODO without an author
    # flake8-bandit is enabled as a whole. Every rule it adds beyond the ones
    # this repo already satisfied is a security audit with zero current
    # violations -- eval/exec, pickle and other unsafe deserializers,
    # `shell=True`, disabled TLS verification, weak ciphers, XML parsers,
    # Jinja autoescape -- so the group only guards against new ones. The
    # members that do fire are documented individually:
    # - S101: `assert` outside tests (python -O strips it, so it is not a
    #   runtime guard); test suites and script self-tests are exempt below.
    # - S110/S112: `except Exception: pass` / `continue`. A deliberate
    #   best-effort block reads better as `contextlib.suppress(...)`, which the
    #   repo already uses; a narrower `except OSError:` is not flagged either.
    # - S603/S605/S607: every subprocess and shell invocation. Application code
    #   justifies each one inline; developer tooling is exempt below.
    # - S608: every SQL string built by interpolation. Values always use bound
    #   parameters; the remaining sites interpolate table or column names, which
    #   bound parameters cannot carry, and justify it inline. Applied Alembic
    #   revisions must not be edited, so they are exempt below.
    "S",

    # --- Type annotations -------------------------------------------------
    # flake8-annotations is selected as a family: every function signature names
    # its inputs (ANN001-ANN003) and its result (ANN201/ANN202/ANN204-ANN206),
    # and ANN401 keeps `typing.Any` out of both positions. `object` marks
    # intentionally heterogeneous values at dynamic boundaries. Variadic
    # parameters name the element/value type after the stars; use a concrete
    # homogeneous type when known and `object` for intentionally heterogeneous
    # forwarding. Return types matter most where there is no `self` to infer
    # from (ANN205 staticmethods, ANN206 classmethods -- mostly alternative
    # constructors and frozen-clock `now()` doubles) and on the special methods
    # ANN204 covers: `__init__`/`__exit__`/`__json__` and friends have a fixed
    # contract, so writing the return type down keeps the serialization dunders
    # (`__json__` returning a dict vs an enum value's str) readable at a glance.
    # The complete family passes on the current baseline, so keep the family
    # selected as new ANN rules are added.
    "ANN",     # flake8-annotations

    # --- Boolean arguments ------------------------------------------------
    # flake8-boolean-trap is otherwise off: FBT001/FBT002 would rewrite the
    # signatures of stable service helpers and DTO constructors, which is a
    # separate project. FBT003 only asks the caller to name the flag, so
    # `get_shifu_info(app, bid, preview_mode=False)` says which of the two
    # code paths it takes. Third-party APIs that only accept the flag
    # positionally (SQLAlchemy, the MySQL DBAPI `ping`, `socket.setblocking`,
    # `monkeypatch.setitem`) carry an inline noqa.
    "FBT003",  # boolean positional value in a call
    # flake8-type-checking is enabled as a whole. Annotation-only standard-
    # library and third-party imports live behind TYPE_CHECKING; the Pydantic
    # runtime-evaluation contract below keeps model field types available while
    # classes are created. The remaining rules catch the mistakes such a block
    # invites: a name imported there but used at runtime (TC004), an empty or
    # redundant block (TC005/TC010), or a needlessly quoted annotation
    # (TC006/TC007).
    "TC",

    # --- Docstrings -------------------------------------------------------
    # pydocstyle is enabled as a whole; the members that would need thousands
    # of new docstrings, conflict with a selected sibling rule, or rewrite
    # embedded Swagger YAML are ignored below.
    "D",

    # --- Modernization ----------------------------------------------------
    # UP040/UP046/UP047 remain selected through the UP prefix but stay dormant
    # while the repository supports Python 3.11; Ruff will activate them with
    # Python 3.12.
    # UP035 is satisfied except in the two `admin` / `admin_operations.courses`
    # compatibility shims, which re-export `typing.Dict` / `typing.Set` as part
    # of their public surface and carry a file-level `# ruff: noqa: UP035`.
    "UP",

    # --- Ruff-native rules ------------------------------------------------
    # RUF100 is enforced, so a `# noqa` may only name a rule this file selects:
    # reasons for exceptions to non-selected rules (BLE001, DTZ001, SLF001)
    # are written as plain comments instead.
    "RUF",
]
ignore = [
    "E501",    # line length is owned by the formatter
    "D203",    # blank line before a class docstring -- conflicts with D211
    "D213",    # summary on the second line -- conflicts with D212
    "DTZ001",  # naive datetime() -- naive UTC is the house convention
    "PLC0415", # import not at top of file -- deliberate lazy imports (~1.2k)
]

[lint.flake8-type-checking]
# Pydantic resolves model field annotations while creating each class. Keep
# their standard-library and third-party field types imported at runtime;
# TC002/TC003 move only genuinely annotation-only imports behind TYPE_CHECKING.
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[lint.per-file-ignores]
# Tests intentionally freeze user text, provider payloads, protocol samples,
# and malformed-input regressions verbatim. RUF001 would make those fixtures
# less faithful, so it remains enforced in production code but not test files.
"**/tests/**" = ["RUF001"]
"**/test_*.py" = ["RUF001"]
"**/*_test.py" = ["RUF001"]
"**/conftest.py" = ["RUF001"]
# `assert` is the point of a test, and both scripts below are test code: one is
# a pytest module, the other keeps its regex fixtures in a `run_self_test()`.
# Developer tooling (repo scripts, backend scripts, test harnesses) also shells
# out to `git`, `node` and `python` with statically built argument lists, so the
# subprocess audit rules only add noise there.
# Test suites are also full of literal fake passwords, tokens and secret keys
# for fixtures and negative cases, which is what S105/S106 flag.
# Behavior-named tests already describe the contract under test, and duplicate
# function or method docstrings make failure output harder to scan.
"src/api/tests/**" = ["D102", "D103", "S101", "S105", "S106", "S603", "S607", "T20"]
# `app.py`, `celery_app.py` and `gunicorn.conf.py` are process entrypoints run
# by path and never imported, so making `src/api` a package would only shadow
# the top-level `flaskr` import path. `src/api/scripts` is a real package
# instead (`tests/scripts` imports from it), so INP001 stays enforced there.
"src/api/app.py" = ["INP001"]
"src/api/celery_app.py" = ["INP001"]
"src/api/gunicorn.conf.py" = ["INP001"]
# Alembic loads `env.py` and every revision by file path, and packaging them
# would break `alembic` revision discovery. Applied migration history is
# immutable, so its conventional `upgrade` / `downgrade` hooks retain D103.
"src/api/migrations/**" = ["D103", "INP001"]
# Alembic generates every revision under this directory. The repository
# treats generated migration code as immutable history, so later Ruff
# adoption must not require rewriting any revision in this directory.
"src/api/migrations/versions/**" = ["ALL"]
# These trees are input fixtures for check_architecture_boundaries.py, not
# importable code. Their deliberately minimal functions model boundary inputs.
"scripts/testdata/**" = ["D103", "INP001"]
"scripts/test_*.py" = ["D102", "D103", "S101"]
"scripts/check_example_identifiers.py" = ["S101"]
# Developer scripts and the backend inventory/harness tooling are console
# programs: printing to stdout is their interface.
"scripts/**" = ["S603", "S607", "T20"]
# This fixture exists so check_architecture_boundaries.py can prove it resolves
# parent-relative imports; rewriting them would delete the test case.
"scripts/testdata/architecture_boundaries/**" = ["TID252"]
"src/api/scripts/**" = ["S603", "S607", "T20"]
