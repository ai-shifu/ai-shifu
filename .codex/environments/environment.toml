# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "AI-Shifu local"

[setup]
script = ""

[setup.darwin]
script = '''
set -eu

source_tree="${CODEX_SOURCE_TREE_PATH:-}"
worktree_path="${CODEX_WORKTREE_PATH:-$(pwd)}"
frontend_env_filenames=".env .env.local .env.development .env.development.local .env.production .env.production.local .env.test .env.test.local"
source_env_files=""
reserved_env_files=""

copy_local_env() {
  source_file="$1"
  target_file="$2"
  if [ -f "$source_file" ] && [ ! -e "$target_file" ] && \
    [ ! -L "$target_file" ]; then
    cp -p "$source_file" "$target_file"
  fi
}

close_frontend_env_file() {
  case "$1" in
    .env) exec 3>&- ;;
    .env.local) exec 4>&- ;;
    .env.development) exec 5>&- ;;
    .env.development.local) exec 6>&- ;;
    .env.production) exec 7>&- ;;
    .env.production.local) exec 8>&- ;;
    .env.test) exec 9>&- ;;
    .env.test.local) exec 10>&- ;;
    *) return 1 ;;
  esac
}

reserve_frontend_env_file() {
  env_filename="$1"
  target_file="$worktree_path/src/web/$env_filename"
  case "$env_filename" in
    .env)
      if ! exec 3>"$target_file"; then return 1; fi
      ;;
    .env.local)
      if ! exec 4>"$target_file"; then return 1; fi
      ;;
    .env.development)
      if ! exec 5>"$target_file"; then return 1; fi
      ;;
    .env.development.local)
      if ! exec 6>"$target_file"; then return 1; fi
      ;;
    .env.production)
      if ! exec 7>"$target_file"; then return 1; fi
      ;;
    .env.production.local)
      if ! exec 8>"$target_file"; then return 1; fi
      ;;
    .env.test)
      if ! exec 9>"$target_file"; then return 1; fi
      ;;
    .env.test.local)
      if ! exec 10>"$target_file"; then return 1; fi
      ;;
    *) return 1 ;;
  esac
  reserved_env_files="$reserved_env_files $env_filename"
}

write_frontend_env_file() {
  env_filename="$1"
  source_file="$source_tree/src/web/$env_filename"
  case "$env_filename" in
    .env) file_descriptor=3 ;;
    .env.local) file_descriptor=4 ;;
    .env.development) file_descriptor=5 ;;
    .env.development.local) file_descriptor=6 ;;
    .env.production) file_descriptor=7 ;;
    .env.production.local) file_descriptor=8 ;;
    .env.test) file_descriptor=9 ;;
    .env.test.local) file_descriptor=10 ;;
    *) return 1 ;;
  esac
  python3 -c 'import os
import stat
import sys

file_descriptor = int(sys.argv[1])
source_path = sys.argv[2]
source_stat = os.stat(source_path)
with open(source_path, "rb") as source, os.fdopen(os.dup(file_descriptor), "wb") as target:
    while True:
        chunk = source.read(1024 * 1024)
        if not chunk:
            break
        target.write(chunk)
os.fchmod(file_descriptor, stat.S_IMODE(source_stat.st_mode))
' "$file_descriptor" "$source_file"
}

cleanup_frontend_env_reservations() {
  for env_filename in $reserved_env_files
  do
    close_frontend_env_file "$env_filename"
  done
  for env_filename in $reserved_env_files
  do
    target_file="$worktree_path/src/web/$env_filename"
    if [ -f "$target_file" ] && [ ! -L "$target_file" ]; then
      rm -f "$target_file"
    fi
  done
}

check_unreserved_frontend_env_files() {
  for env_filename in $frontend_env_filenames
  do
    case " $source_env_files " in
      *" $env_filename "*) ;;
      *)
        target_file="$worktree_path/src/web/$env_filename"
        if [ -e "$target_file" ] || [ -L "$target_file" ]; then
          return 1
        fi
        ;;
    esac
  done
}

copy_frontend_env() {
  source_env_files=""
  for env_filename in $frontend_env_filenames
  do
    source_file="$source_tree/src/web/$env_filename"
    if [ -f "$source_file" ]; then
      source_env_files="$source_env_files $env_filename"
    fi
  done

  if [ -z "$source_env_files" ]; then
    return
  fi

  for env_filename in $frontend_env_filenames
  do
    target_file="$worktree_path/src/web/$env_filename"
    if [ -e "$target_file" ] || [ -L "$target_file" ]; then
      return
    fi
  done

  (
    set -C
    reserved_env_files=""
    for env_filename in $source_env_files
    do
      if ! reserve_frontend_env_file "$env_filename"; then
        cleanup_frontend_env_reservations
        exit 0
      fi
    done

    if ! check_unreserved_frontend_env_files; then
      cleanup_frontend_env_reservations
      exit 0
    fi

    for env_filename in $source_env_files
    do
      if ! write_frontend_env_file "$env_filename"; then
        cleanup_frontend_env_reservations
        exit 1
      fi
    done

    if ! check_unreserved_frontend_env_files; then
      cleanup_frontend_env_reservations
      exit 0
    fi

    for env_filename in $reserved_env_files
    do
      close_frontend_env_file "$env_filename"
    done
  )
}

reuse_directory_if_compatible() {
  source_directory="$1"
  target_directory="$2"
  source_manifest="$3"
  target_manifest="$4"
  if [ -d "$source_directory" ] && [ ! -e "$target_directory" ] && \
    cmp -s "$source_manifest" "$target_manifest"; then
    ln -s "$source_directory" "$target_directory"
  fi
}

reuse_frontend_node_modules() {
  current_frontend_directory="$1"
  target_frontend_directory="$2"

  reuse_directory_if_compatible \
    "$current_frontend_directory/node_modules" \
    "$target_frontend_directory/node_modules" \
    "$current_frontend_directory/package-lock.json" \
    "$target_frontend_directory/package-lock.json"
}

if [ -n "$source_tree" ] && [ "$source_tree" != "$worktree_path" ]; then
  current_frontend_directory="$source_tree/src/web"
  target_frontend_directory="$worktree_path/src/web"
  copy_local_env "$source_tree/.env" "$worktree_path/.env"
  copy_local_env "$source_tree/src/api/.env" "$worktree_path/src/api/.env"
  copy_frontend_env
  reuse_directory_if_compatible \
    "$source_tree/.venv" \
    "$worktree_path/.venv" \
    "$source_tree/src/api/requirements.txt" \
    "$worktree_path/src/api/requirements.txt"
  reuse_frontend_node_modules \
    "$current_frontend_directory" \
    "$target_frontend_directory"
fi'''

