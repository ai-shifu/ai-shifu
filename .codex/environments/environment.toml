[[actions]]
name = "Backend API"
icon = "run"
command = '''
cd src/api
export FLASK_APP=app.py
exec ../../.venv/bin/python -m flask run --host 0.0.0.0 --port 5800
'''

[[actions]]
name = "Cook Web"
icon = "run"
command = '''
cd src/cook-web
exec npm run dev
'''

[[actions]]
name = "Backend tests"
icon = "test"
command = '''
cd src/api
../../.venv/bin/python -m pytest -q
'''

[[actions]]
name = "Frontend tests"
icon = "test"
command = '''
cd src/cook-web
npm run test:ci
'''

[[actions]]
name = "Repository checks"
icon = "test"
command = '''
PATH="$PWD/.venv/bin:$PATH" lefthook run pre-commit --all-files
'''

[[actions]]
name = "Rebase latest main"
icon = "tool"
command = '''
git fetch origin main
git rebase origin/main
'''
