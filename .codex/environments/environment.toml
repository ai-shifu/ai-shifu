# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "AI-Shifu local"

[setup]
script = ""

[setup.darwin]
script = '''
set -eu

source_tree="${CODEX_SOURCE_TREE_PATH:-}"
worktree_path="${CODEX_WORKTREE_PATH:-$(pwd)}"

copy_local_env() {
  source_file="$1"
  target_file="$2"
  if [ -f "$source_file" ] && [ ! -e "$target_file" ] && \
    [ ! -L "$target_file" ]; then
    cp -p "$source_file" "$target_file"
  fi
}

copy_frontend_env() {
  python3 -c 'import os
import stat
import sys

ENV_FILENAMES = (
    ".env",
    ".env.local",
    ".env.development",
    ".env.development.local",
    ".env.production",
    ".env.production.local",
    ".env.test",
    ".env.test.local",
)
source_root = sys.argv[1]
target_root = sys.argv[2]

source_files = []
for filename in ENV_FILENAMES:
    source_path = os.path.join(source_root, filename)
    try:
        source_stat = os.stat(source_path)
    except FileNotFoundError:
        continue
    if stat.S_ISREG(source_stat.st_mode):
        source_files.append((filename, source_path, source_stat))

if not source_files:
    raise SystemExit(0)

target_paths = {
    filename: os.path.join(target_root, filename) for filename in ENV_FILENAMES
}
if any(os.path.lexists(target_path) for target_path in target_paths.values()):
    raise SystemExit(0)


class ConcurrentEnvironmentChange(Exception):
    pass


source_names = {filename for filename, _, _ in source_files}
reservations = []


def unreserved_target_exists():
    return any(
        filename not in source_names and os.path.lexists(target_path)
        for filename, target_path in target_paths.items()
    )


def reservation_path_matches(reservation):
    _, _, _, target_path, file_descriptor = reservation
    try:
        path_stat = os.lstat(target_path)
    except FileNotFoundError:
        return False
    descriptor_stat = os.fstat(file_descriptor)
    return (
        path_stat.st_dev == descriptor_stat.st_dev
        and path_stat.st_ino == descriptor_stat.st_ino
    )


def reservations_changed():
    return any(
        not reservation_path_matches(reservation) for reservation in reservations
    )


def clean_up_reservations():
    for reservation in reservations:
        _, _, _, target_path, file_descriptor = reservation
        try:
            if reservation_path_matches(reservation):
                os.unlink(target_path)
        except FileNotFoundError:
            pass
        finally:
            os.close(file_descriptor)


try:
    for filename, source_path, source_stat in source_files:
        file_descriptor = os.open(
            target_paths[filename],
            os.O_WRONLY | os.O_CREAT | os.O_EXCL,
            stat.S_IMODE(source_stat.st_mode),
        )
        reservations.append(
            (
                filename,
                source_path,
                source_stat,
                target_paths[filename],
                file_descriptor,
            )
        )

    if reservations_changed() or unreserved_target_exists():
        raise ConcurrentEnvironmentChange()

    for _, source_path, source_stat, _, file_descriptor in reservations:
        with open(source_path, "rb") as source:
            while True:
                chunk = source.read(1024 * 1024)
                if not chunk:
                    break
                offset = 0
                while offset < len(chunk):
                    written = os.write(file_descriptor, chunk[offset:])
                    if written <= 0:
                        raise OSError("failed to write frontend environment file")
                    offset += written
        os.fchmod(file_descriptor, stat.S_IMODE(source_stat.st_mode))

    if reservations_changed() or unreserved_target_exists():
        raise ConcurrentEnvironmentChange()
except (ConcurrentEnvironmentChange, FileExistsError):
    clean_up_reservations()
    raise SystemExit(0)
except BaseException:
    clean_up_reservations()
    raise
else:
    for _, _, _, _, file_descriptor in reservations:
        os.close(file_descriptor)
' \
    "$source_tree/src/web" \
    "$worktree_path/src/web"
}

reuse_directory_if_compatible() {
  source_directory="$1"
  target_directory="$2"
  source_manifest="$3"
  target_manifest="$4"
  if [ -d "$source_directory" ] && [ ! -e "$target_directory" ] && \
    cmp -s "$source_manifest" "$target_manifest"; then
    ln -s "$source_directory" "$target_directory"
  fi
}

reuse_frontend_node_modules() {
  current_frontend_directory="$1"
  target_frontend_directory="$2"

  reuse_directory_if_compatible \
    "$current_frontend_directory/node_modules" \
    "$target_frontend_directory/node_modules" \
    "$current_frontend_directory/package-lock.json" \
    "$target_frontend_directory/package-lock.json"
}

if [ -n "$source_tree" ] && [ "$source_tree" != "$worktree_path" ]; then
  current_frontend_directory="$source_tree/src/web"
  target_frontend_directory="$worktree_path/src/web"
  copy_local_env "$source_tree/.env" "$worktree_path/.env"
  copy_local_env "$source_tree/src/api/.env" "$worktree_path/src/api/.env"
  copy_frontend_env
  reuse_directory_if_compatible \
    "$source_tree/.venv" \
    "$worktree_path/.venv" \
    "$source_tree/src/api/requirements.txt" \
    "$worktree_path/src/api/requirements.txt"
  reuse_frontend_node_modules \
    "$current_frontend_directory" \
    "$target_frontend_directory"
fi'''

