name: Static Checks

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Twice a week at 03:00 UTC to catch drift on main between merges
    - cron: '0 3 * * 1,4'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install instruction Markdown parser
        run: python -m pip install markdown-it-py==4.0.0

      - name: Check markdown-flow-ui release pin
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: |
          node <<'NODE'
          const fs = require("fs");

          const path = "src/web/package.json";
          const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
          const deps = { ...(pkg.dependencies || {}), ...(pkg.devDependencies || {}) };
          const raw = deps["markdown-flow-ui"];

          if (!raw) {
            console.error(`::error::No 'markdown-flow-ui' dependency found in ${path}.`);
            process.exit(1);
          }

          // Strip any range prefix (^, ~, >=, spaces, ...) to get the core version.
          const core = raw.replace(/^[^\d]*/, "");

          // semver pre-release = anything after a hyphen (e.g. 0.1.128-dev.1)
          if (core.includes("-")) {
            console.error(
              `::error::markdown-flow-ui ${raw} is a pre-release/dev build and cannot be ` +
                "merged into main. Pin a release version (X.Y.Z) first — publish a release " +
                "build from markdown-flow-ui, then update the pin.",
            );
            process.exit(1);
          }

          console.log(`OK: markdown-flow-ui ${raw} is a release version.`);
          NODE

      - name: Validate architecture fixtures
        run: python scripts/check_architecture_boundaries.py --run-fixture-tests

      - name: Regenerate knowledge docs
        id: knowledge
        run: python scripts/build_repo_knowledge_index.py

      - name: Ensure generated artifacts are up to date
        run: |
          git diff --exit-code -- \
            docs \
            src/api/skills/README.md \
            src/web/skills/README.md \
            scripts/build_repo_knowledge_index.py

      - name: Run repo harness validation
        run: |
          python -m unittest discover -s scripts -p 'test_repo_instructions.py'
          python -m unittest discover -s scripts -p 'test_repo_knowledge_index.py'
          python scripts/check_repo_harness.py
          python scripts/check_architecture_boundaries.py

      - name: Run script and harness regression tests
        run: |
          python -m pip install pytest==9.0.3
          python -m unittest discover -s scripts -p 'test_prettier_check_changed.py'
          python -m pytest -q scripts/harness/tests

      - name: Run release workflow regression tests
        run: |
          python -m pip install PyYAML==6.0.3 commitizen==4.16.2
          python -m unittest discover -s scripts -p 'test_release_*.py'

      - name: Enforce unit-of-work commit-site ratchet
        run: python scripts/check_uow_commit_sites.py

      - name: Verify translation parity
        run: python scripts/check_translations.py

      - name: Verify translation key usage
        run: |
          python -m unittest discover -s scripts -p 'test_translation_usage.py'
          python scripts/check_translation_usage.py --fail-on-unused

      - name: Ensure locales metadata is up to date
        run: |
          python scripts/generate_languages.py
          git diff --exit-code -- src/i18n/locales.json

      - name: Summarize harness health
        if: always() && steps.knowledge.outcome == 'success'
        run: cat docs/generated/harness-health.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload harness health
        if: always() && steps.knowledge.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: harness-health
          path: docs/generated/harness-health.md
          if-no-files-found: error
