name: Docker Packaging Checks

on:
  pull_request:
    paths:
      - .github/workflows/build-latest.yml
      - .github/workflows/build-on-release.yml
      - .github/workflows/build-docker-image.yml
      - .github/workflows/docker-build-check.yml
      - .github/actions/docker-image-metadata/**
      - scripts/merge_docker_manifests.py
      - scripts/test_merge_docker_manifests.py
      - scripts/check_docker_image.py
      - scripts/test_check_docker_image.py
      - .dockerignore
      - src/api/**
      - src/web/**
      - src/i18n/**
      - '!src/api/tests/**'
      - '!src/web/**/*.test.*'
      - '!**/*.md'
      - '!**/*.mdx'
  workflow_dispatch:
    inputs:
      publish-candidates:
        description: Publish isolated candidate tags to verify both configured registries
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: docker-packaging-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  manifest-tests:
    name: Manifest publication regression tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install pytest
      - name: Test manifest publication without registry access
        run: python -m pytest scripts/test_merge_docker_manifests.py scripts/test_check_docker_image.py -q

  native-build:
    name: Validate native image (${{ matrix.service }})
    if: github.event_name == 'pull_request' || !inputs.publish-candidates
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            image-name: ai-shifu-api
            dockerfile: src/api/Dockerfile
          - service: web
            image-name: ai-shifu-cook-web
            dockerfile: src/web/Dockerfile
    uses: ./.github/workflows/build-docker-image.yml
    # No inherited registry secrets; validation never logs in or publishes images.
    with:
      service: ${{ matrix.service }}
      image-name: ${{ matrix.image-name }}
      dockerfile: ${{ matrix.dockerfile }}
      push-images: false
      tags: |
        type=raw,value=validation-${{ github.sha }}
      labels: |
        org.opencontainers.image.revision=${{ github.sha }}

  candidate-build:
    name: Validate candidate publication (${{ matrix.service }})
    if: github.event_name == 'workflow_dispatch' && inputs.publish-candidates
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            image-name: AI_SHIFU_API_IMAGE_NAME
            default-image: ai-shifu-api
            dockerfile: src/api/Dockerfile
          - service: web
            image-name: AI_SHIFU_COOK_WEB_IMAGE_NAME
            default-image: ai-shifu-cook-web
            dockerfile: src/web/Dockerfile
    uses: ./.github/workflows/build-docker-image.yml
    secrets: inherit
    with:
      service: ${{ matrix.service }}
      image-name: ${{ vars[matrix.image-name] || matrix.default-image }}
      dockerfile: ${{ matrix.dockerfile }}
      push-images: true
      require-registry: true
      tags: |
        type=raw,value=candidate-${{ github.run_id }}-${{ github.run_attempt }}
      labels: |
        org.opencontainers.image.revision=${{ github.sha }}
