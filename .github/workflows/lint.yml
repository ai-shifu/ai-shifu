name: Lint

# Replaces the pre-commit.ci PR check, mirroring its behaviour:
#   - auto-fixable issues are fixed and exported as a patch artifact, which the
#     trusted lint-autofix-push.yml workflow commits back to the PR branch
#   - issues that cannot be auto-fixed (ruff E722, invalid YAML/JSON, merge
#     markers, hardcoded CJK in backend) fail the run.
#
# This job runs pull-request-controlled tooling (npm ci, linters), so it never
# holds a write-capable token; see lint-autofix-push.yml.
#
# Scope: only the checks NOT already enforced by another workflow. Prettier has
# prettier-check.yml, the repo-harness scripts have repo-harness.yml, and the
# translation scripts have the Static Checks job in repo-harness.yml -- those
# are intentionally not duplicated here. ESLint mirrors the old pre-commit.ci
# behaviour (auto-fix only, never a hard gate), since cook-web carries known
# eslint warnings.
#
# Auto-fixes stay scoped to the files changed in the PR (like pre-commit.ci),
# so unrelated trees are not rewritten. Ruff check and format are then
# enforced on the whole repository so the pinned rule set in ruff.toml is a
# repo-wide gate, including PRs that only change ruff.toml.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autofix:
    runs-on: ubuntu-latest
    # This job installs and runs pull-request-controlled tooling, so it stays
    # read-only. The patch it produces is pushed by lint-autofix-push.yml.
    permissions:
      contents: read
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v6
        with:
          # Same-repo PRs: check out the head branch so auto-fixes can be pushed
          # back. Fork PRs: head_ref does not exist in this repo, so fall back to
          # the default PR merge ref (read-only; fork fixes are never pushed).
          ref: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref || '' }}
          fetch-depth: 0
          # Nothing here needs credentials: the repo is public and the auto-fix
          # commit is pushed by a separate trusted workflow.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js (match Cook Web engines)
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install "ruff==0.16.3" "pre-commit-hooks==6.0.0"
          (cd src/cook-web && npm ci)

      - name: Collect files changed in this PR
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          git fetch --no-tags --depth=1 origin "$base" || true
          git diff --name-only --diff-filter=ACMR "$base"...HEAD > /tmp/changed.txt || \
            git diff --name-only --diff-filter=ACMR "$base" HEAD > /tmp/changed.txt
          echo "Changed files:"; cat /tmp/changed.txt
          # Text-only subset (grep -I reports no match on binary files), so the
          # whitespace/eof fixers never corrupt PNGs and other binaries.
          while read -r f; do [ -f "$f" ] && grep -Iq . "$f" && printf '%s\n' "$f"; done \
            < /tmp/changed.txt > /tmp/changed_text.txt || true

      - name: Auto-fix (changed files only; never fails this step)
        run: |
          sel() { grep -E "$1" /tmp/changed.txt || true; }
          py=$(sel '\.py$')
          [ -n "$py" ] && { ruff check --fix $py || true; ruff format $py || true; }
          txt=$(cat /tmp/changed_text.txt)
          [ -n "$txt" ] && { end-of-file-fixer $txt || true; trailing-whitespace-fixer $txt || true; }
          i18n=$(sel '^src/i18n/.*\.json$')
          [ -n "$i18n" ] && { pretty-format-json --autofix --indent=2 --no-ensure-ascii --top-keys=__namespace__ $i18n || true; }
          reqs=$(sel 'requirements.*\.txt$' | grep -v '^src/api/requirements\.txt$' || true)
          [ -n "$reqs" ] && { requirements-txt-fixer $reqs || true; }
          cw=$(sel '^src/cook-web/.*\.(js|jsx|ts|tsx|mjs|cjs|css|scss|md|mdx|json)$')
          [ -n "$cw" ] && { src/cook-web/node_modules/.bin/prettier --write --config src/cook-web/.prettierrc --ignore-path src/cook-web/.prettierignore $cw || true; }
          cwlint=$(sel '^src/cook-web/.*\.(js|jsx|ts|tsx)$' | sed 's|src/cook-web/||g')
          [ -n "$cwlint" ] && { (cd src/cook-web && npm run lint-file -- $cwlint) || true; }
          true

      - name: Export auto-fixes as a patch (fail what CI cannot push)
        id: patch
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No auto-fixes needed."
            exit 0
          fi
          echo "Auto-fixable changes detected:"; git --no-pager diff --stat
          if [ "$SAME_REPO" != "true" ]; then
            echo "::error::Auto-fixable lint issues found on a fork PR (cannot push fixes). Run 'lefthook run pre-commit --all-files' locally and push the result."
            exit 1
          fi
          # GITHUB_TOKEN may not create or update workflow files, so those fixes
          # can never be pushed back.
          if [ -n "$(git status --porcelain -- .github/workflows)" ]; then
            echo "::error::Auto-fixable lint issues under .github/workflows/ cannot be pushed by CI. Run 'lefthook run pre-commit --all-files' locally and push the result."
            exit 1
          fi
          mkdir -p /tmp/autofix
          git add -A
          git diff --cached --binary > /tmp/autofix/autofix.patch
          printf '%s\n' "$HEAD_SHA" > /tmp/autofix/head_sha
          echo "has-patch=true" >> "$GITHUB_OUTPUT"

      - name: Upload auto-fix patch
        if: steps.patch.outputs.has-patch == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lint-autofix
          path: /tmp/autofix
          retention-days: 1

      - name: Hard-fail checks (on the now-fixed tree)
        run: |
          sel() { grep -E "$1" /tmp/changed.txt || true; }
          yaml=$(sel '\.(ya?ml)$'); [ -n "$yaml" ] && check-yaml $yaml
          json=$(sel '\.json$'); [ -n "$json" ] && check-json $json
          txt=$(cat /tmp/changed_text.txt)
          [ -n "$txt" ] && check-merge-conflict $txt
          all=$(cat /tmp/changed.txt)
          [ -n "$all" ] && check-symlinks $all
          ruff check .
          ruff check . --select UP040 --target-version py312
          ruff format --check .
          python3 scripts/check_backend_hardcoded_cn.py
          echo "Lint hard-fail checks passed."
