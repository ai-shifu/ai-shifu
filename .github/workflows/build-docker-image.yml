name: Build Docker image on native runners

on:
  workflow_call:
    inputs:
      source-ref:
        description: Optional verified source commit; empty retains the caller checkout
        type: string
        default: ""
      service:
        type: string
        required: true
      image-name:
        type: string
        required: true
      dockerfile:
        type: string
        required: true
      tags:
        type: string
        required: true
      labels:
        type: string
        required: true
      push-images:
        type: boolean
        default: true
      require-registry:
        type: boolean
        default: false
      publish-ghcr:
        type: boolean
        default: false
      build-args:
        type: string
        default: ""
      update-description:
        type: boolean
        default: false
      architectures:
        description: Native architectures to validate; publishing callers retain both
        type: string
        default: '["amd64","arm64"]'

# Inherit caller permissions: publishers grant packages: write, PR checks do not.

jobs:
  build:
    name: Build ${{ inputs.service }} (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.architectures) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source-ref }}

      - name: Record frontend build revision
        if: inputs.service == 'web'
        run: git rev-parse HEAD > src/web/.app-build-sha

      - name: Verify native runner
        env:
          EXPECTED_MACHINE: ${{ matrix.arch == 'arm64' && 'aarch64' || 'x86_64' }}
        run: |
          test "$(uname -m)" = "$EXPECTED_MACHINE"
          uname -srmo
          docker version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:v0.33.1

      - name: Build diagnostics
        run: |
          docker buildx version
          docker buildx inspect --bootstrap

      - name: Prepare image metadata
        id: meta
        uses: ./.github/actions/docker-image-metadata
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          ALIYUN_DOCKER_REGISTRY: ${{ vars.ALIYUN_DOCKER_REGISTRY || 'registry.cn-beijing.aliyuncs.com' }}
          ALIYUN_DOCKER_USERNAME: ${{ secrets.ALIYUN_USER }}
          ALIYUN_DOCKER_PASSWORD: ${{ secrets.ALIYUN_TOKEN }}
        with:
          image-name: ${{ inputs.image-name }}
          tags: ${{ inputs.tags }}
          labels: ${{ inputs.labels }}
          push-images: ${{ inputs.push-images }}
          require-registry: ${{ inputs.require-registry }}
          publish-ghcr: ${{ inputs.publish-ghcr }}

      - name: Build native image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          # The archive can be loaded by Docker and copied by digest from its OCI layout.
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          tags: ai-shifu-smoke:${{ inputs.service }}-${{ matrix.arch }}-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: false
          sbom: false
          # Distinct writers for each service/platform; latest and release can reuse layers.
          cache-from: type=gha,scope=ai-shifu-${{ inputs.service }}-${{ matrix.arch }}
          cache-to: type=gha,scope=ai-shifu-${{ inputs.service }}-${{ matrix.arch }},mode=max
          build-args: ${{ inputs.build-args }}

      - name: Smoke-test production image
        id: smoke
        env:
          IMAGE_SERVICE: ${{ inputs.service }}
          IMAGE_ARCH: ${{ matrix.arch }}
          LOCAL_IMAGE: ai-shifu-smoke:${{ inputs.service }}-${{ matrix.arch }}-${{ github.sha }}
        run: |
          docker load --input "$RUNNER_TEMP/image.tar"
          python3 scripts/check_docker_image.py smoke "$IMAGE_SERVICE" "$LOCAL_IMAGE" \
            "linux/$IMAGE_ARCH" --record "$RUNNER_TEMP/$IMAGE_ARCH.json" \
            --archive "$RUNNER_TEMP/image.tar"

      - name: Upload tested image
        if: steps.meta.outputs.push-images == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: docker-image-${{ inputs.service }}-${{ matrix.arch }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/image.tar
            ${{ runner.temp }}/${{ matrix.arch }}.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true

      - name: Native build summary
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          IMAGE_SERVICE: ${{ inputs.service }}
          IMAGE_ARCH: ${{ matrix.arch }}
        run: |
          echo "### $IMAGE_SERVICE / linux/$IMAGE_ARCH: $BUILD_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          echo "- Native runner: $(uname -m)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production smoke: $SMOKE_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cache scope: ai-shifu-$IMAGE_SERVICE-$IMAGE_ARCH" >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish ${{ inputs.service }} to ${{ matrix.registry }}
    needs: build
    if: inputs.push-images
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        registry: [ghcr, dockerhub, aliyun]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source-ref }}

      - name: Prepare image metadata
        id: meta
        uses: ./.github/actions/docker-image-metadata
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          ALIYUN_DOCKER_REGISTRY: ${{ vars.ALIYUN_DOCKER_REGISTRY || 'registry.cn-beijing.aliyuncs.com' }}
          ALIYUN_DOCKER_USERNAME: ${{ secrets.ALIYUN_USER }}
          ALIYUN_DOCKER_PASSWORD: ${{ secrets.ALIYUN_TOKEN }}
        with:
          image-name: ${{ inputs.image-name }}
          tags: ${{ inputs.tags }}
          labels: ${{ inputs.labels }}
          push-images: ${{ inputs.push-images }}
          publish-ghcr: ${{ inputs.publish-ghcr }}
          registry: ${{ matrix.registry }}

      - name: Set up ORAS
        if: steps.meta.outputs.push-images == 'true'
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
        with:
          version: '1.3.0'

      - name: Download tested images
        if: steps.meta.outputs.push-images == 'true'
        uses: actions/download-artifact@v8
        with:
          # A failed-job rerun can reuse the archives of successful build jobs.
          pattern: docker-image-${{ inputs.service }}-*
          path: ${{ runner.temp }}/images

      - name: Push tested images and verify multi-platform tags
        if: steps.meta.outputs.push-images == 'true'
        env:
          IMAGE_METADATA: ${{ steps.meta.outputs.json }}
          REGISTRY_USERNAME: ${{ matrix.registry == 'ghcr' && github.actor || matrix.registry == 'dockerhub' && secrets.DOCKERHUB_USER || matrix.registry == 'aliyun' && secrets.ALIYUN_USER || '' }}
          REGISTRY_PASSWORD: ${{ matrix.registry == 'ghcr' && github.token || matrix.registry == 'dockerhub' && secrets.DOCKERHUB_TOKEN || matrix.registry == 'aliyun' && secrets.ALIYUN_TOKEN || '' }}
        run: python3 scripts/merge_docker_manifests.py "$RUNNER_TEMP/images"

      - name: Update Docker Hub repository description
        if: inputs.update-description && matrix.registry == 'dockerhub' && steps.meta.outputs.push-images == 'true'
        timeout-minutes: 2
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USER }}/${{ inputs.image-name }}
          short-description: AI-Shifu ${{ inputs.service }} - AI-led chat platform
          readme-filepath: ./README.md

      - name: Image summary
        if: always()
        env:
          IMAGE_SERVICE: ${{ inputs.service }}
          IMAGE_REGISTRY: ${{ matrix.registry }}
          PUSH_IMAGES: ${{ steps.meta.outputs.push-images }}
          PUBLISH_OUTCOME: ${{ job.status }}
        run: |
          echo "### $IMAGE_SERVICE on $IMAGE_REGISTRY: $PUBLISH_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          echo "- Publication enabled: $PUSH_IMAGES" >> "$GITHUB_STEP_SUMMARY"
          echo '- Required platforms: linux/amd64, linux/arm64' >> "$GITHUB_STEP_SUMMARY"
