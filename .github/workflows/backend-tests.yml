name: Backend Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-tests:
    name: Run backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BACKEND_PYTHON_VERSION: "3.11.16"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.BACKEND_PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            src/api/requirements.txt
            src/api/requirements-ci.txt

      - name: Install dependencies
        working-directory: src/api
        run: python -m pip install -r requirements-ci.txt

      - name: Run contract tests
        working-directory: src/api
        run: python -m pytest tests/contract -v --tb=short

      - name: Run full backend test suite (pull request)
        if: github.event_name == 'pull_request'
        working-directory: src/api
        run: python -m pytest

      - name: Run tests with coverage (main/full)
        if: github.event_name != 'pull_request'
        working-directory: src/api
        run: |
          python -m coverage run -m pytest
          python -m coverage report -m
          python -m coverage report -m >> "$GITHUB_STEP_SUMMARY"
