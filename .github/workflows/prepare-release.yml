name: Prepare Release PR

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Final version tag (vX.Y.Z); prepares a PR only'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: prepare-release-pr
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Check out frozen main source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Prepare version changes
        id: version
        env:
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          python scripts/release_workflow.py prepare --tag="$RELEASE_TAG" --source "$GITHUB_SHA"
          printf 'tag=%s\nversion=%s\n' "$RELEASE_TAG" "${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Install release note tooling
        run: python -m pip install commitizen==4.16.2

      - name: Generate PR notes preview and manual merge handoff
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python scripts/release_notes.py --source "$GITHUB_SHA" --version "$RELEASE_VERSION" \
            --repository "$GITHUB_REPOSITORY" --pr-body --output "$RUNNER_TEMP/release-pr.md"

      - name: Create PR with version changes
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          commit-message: "chore: flow version to ${{ steps.version.outputs.tag }}"
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          branch: release/version-bump-${{ steps.version.outputs.tag }}
          base: main
          title: "chore: flow version to ${{ steps.version.outputs.tag }}"
          body-path: ${{ runner.temp }}/release-pr.md
          labels: |
            release
            automated
          draft: false

      - name: Manual merge handoff
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
        run: |
          {
            printf '## Release PR prepared: %s\n\n' "$RELEASE_TAG"
            printf 'Version PR: %s\n\n' "$PR_URL"
            printf '%s\n' 'A human must review CI and manually merge. AI/scripts must never merge or enable auto-merge.'
            printf '%s\n' 'No formal release or tag was created. After merge, review the automatic draft and manually Publish in GitHub.'
            printf '%s\n' 'Main/latest image publication and production CICD/Drone auto-deploy remain independent and unchanged.'
          } >> "$GITHUB_STEP_SUMMARY"
