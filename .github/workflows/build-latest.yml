name: Build Latest Docker Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  DEFAULT_DOCKERHUB_USER: aishifu
  PUSH_LATEST_IMAGES: ${{ vars.PUSH_LATEST_IMAGES || 'true' }}

jobs:
  build-latest:
    name: Build latest (${{ matrix.service }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            image-name: AI_SHIFU_API_IMAGE_NAME
            default-image: ai-shifu-api
            dockerfile: src/api/Dockerfile
          - service: web
            image-name: AI_SHIFU_COOK_WEB_IMAGE_NAME
            default-image: ai-shifu-cook-web
            dockerfile: src/web/Dockerfile
    uses: ./.github/workflows/build-docker-image.yml
    secrets: inherit
    with:
      service: ${{ matrix.service }}
      image-name: ${{ vars[matrix.image-name] || matrix.default-image }}
      dockerfile: ${{ matrix.dockerfile }}
      push-images: ${{ (vars.PUSH_LATEST_IMAGES || 'true') == 'true' }}
      tags: |
        type=raw,value=${{ github.sha }}
        type=raw,value=latest
      labels: |
        org.opencontainers.image.title=AI-Shifu ${{ matrix.service }}
        org.opencontainers.image.description=Latest main build for AI-Shifu (${{ matrix.service }})
        org.opencontainers.image.vendor=AI-Shifu Team
        org.opencontainers.image.licenses=Apache-2.0 WITH Commercial-Use-Conditions
        org.opencontainers.image.source=https://github.com/ai-shifu/ai-shifu
        org.opencontainers.image.documentation=https://github.com/ai-shifu/ai-shifu/blob/main/README.md
        org.opencontainers.image.url=https://ai-shifu.com
        org.opencontainers.image.revision=${{ github.sha }}
