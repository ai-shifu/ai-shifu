name: Build Release Images

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      source_commit:
        description: Verified merged source commit for pre-publication image builds
        required: true
        type: string
      tag:
        description: Exact formal version tag
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

env:
  DEFAULT_DOCKERHUB_USER: aishifu

# Serialize the legacy published-event path with explicit pre-publication builds.
concurrency:
  group: release-images-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  validate-release:
    runs-on: ubuntu-latest
    # GitHub requires push access even for a read-only lookup of a draft Release.
    permissions:
      contents: write
      pull-requests: read
    outputs:
      tag: ${{ steps.extract.outputs.tag }}
      version: ${{ steps.extract.outputs.version }}
      is_prerelease: ${{ steps.extract.outputs.is_prerelease }}
      should_build: ${{ steps.extract.outputs.should_build }}
      commit: ${{ steps.extract.outputs.commit }}

    steps:
      - name: Check out trusted workflow revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Refresh main ancestry
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Validate release source and version before image builds
        id: extract
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SOURCE: ${{ inputs.source_commit || github.sha }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if test "$GITHUB_EVENT_NAME" = release; then
            python scripts/release_workflow.py validate-published --source "$RELEASE_SOURCE" \
              --event "$GITHUB_EVENT_PATH" --repository "$GITHUB_REPOSITORY" --output "$GITHUB_OUTPUT"
          else
            python scripts/release_workflow.py validate-candidate --source "$RELEASE_SOURCE" \
              --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY" --output "$GITHUB_OUTPUT"
          fi

  build-docker:
    name: Build release (${{ matrix.service }})
    permissions:
      contents: read
      packages: write
    needs: validate-release
    if: needs.validate-release.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            image-name: AI_SHIFU_API_IMAGE_NAME
            default-image: ai-shifu-api
            dockerfile: src/api/Dockerfile
          - service: web
            image-name: AI_SHIFU_WEB_IMAGE_NAME
            default-image: ai-shifu-web
            dockerfile: src/web/Dockerfile
    uses: ./.github/workflows/build-docker-image.yml
    secrets: inherit
    with:
      source-ref: ${{ needs.validate-release.outputs.commit }}
      service: ${{ matrix.service }}
      image-name: ${{ vars[matrix.image-name] || matrix.default-image }}
      dockerfile: ${{ matrix.dockerfile }}
      update-description: true
      require-registry: true
      publish-ghcr: true
      build-args: |
        TAG_VERSION=${{ needs.validate-release.outputs.tag }}
      tags: |
        type=raw,value=${{ needs.validate-release.outputs.tag }}
      labels: |
        org.opencontainers.image.title=AI-Shifu ${{ matrix.service }}
        org.opencontainers.image.description=AI-led chat platform - ${{ matrix.service }} service
        org.opencontainers.image.vendor=AI-Shifu Team
        org.opencontainers.image.licenses=Apache-2.0 WITH Commercial-Use-Conditions
        org.opencontainers.image.source=https://github.com/ai-shifu/ai-shifu
        org.opencontainers.image.documentation=https://github.com/ai-shifu/ai-shifu/blob/main/README.md
        org.opencontainers.image.url=https://github.com/ai-shifu/ai-shifu
        org.opencontainers.image.version=${{ needs.validate-release.outputs.tag }}
        org.opencontainers.image.revision=${{ needs.validate-release.outputs.commit }}
        ai-shifu.license-file=https://github.com/ai-shifu/ai-shifu/blob/main/LICENSE.txt
  deploy-summary:
    runs-on: ubuntu-latest
    needs: [validate-release, build-docker]
    if: always() && needs.validate-release.outputs.should_build == 'true'

    steps:
      - name: Create deployment summary
        env:
          DOCKERHUB_OWNER: ${{ secrets.DOCKERHUB_USER || env.DEFAULT_DOCKERHUB_USER }}
          GHCR_OWNER: ${{ github.repository_owner }}
          API_IMAGE_NAME: ${{ vars.AI_SHIFU_API_IMAGE_NAME || 'ai-shifu-api' }}
          WEB_IMAGE_NAME: ${{ vars.AI_SHIFU_WEB_IMAGE_NAME || 'ai-shifu-web' }}
          RELEASE_TAG: ${{ needs.validate-release.outputs.tag }}
        run: |
          ghcr_owner=$(printf '%s' "$GHCR_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "## 🚀 Release Image Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Release**: ${{ needs.validate-release.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: ${{ needs.build-docker.result == 'success' && '✅ Success' || '❌ Failed' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.build-docker.result }}" = "success" ]; then
            echo "### ✅ All Docker Images Built Successfully" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The following images are now available:" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "#### Quick Start Commands" >> $GITHUB_STEP_SUMMARY
            echo '```bash' >> $GITHUB_STEP_SUMMARY
            echo '# Pull all images' >> $GITHUB_STEP_SUMMARY
            echo "docker pull ghcr.io/$ghcr_owner/$API_IMAGE_NAME:$RELEASE_TAG" >> $GITHUB_STEP_SUMMARY
            echo "docker pull ghcr.io/$ghcr_owner/$WEB_IMAGE_NAME:$RELEASE_TAG" >> $GITHUB_STEP_SUMMARY
            echo "docker pull $DOCKERHUB_OWNER/$API_IMAGE_NAME:$RELEASE_TAG" >> $GITHUB_STEP_SUMMARY
            echo "docker pull $DOCKERHUB_OWNER/$WEB_IMAGE_NAME:$RELEASE_TAG" >> $GITHUB_STEP_SUMMARY
            echo '' >> $GITHUB_STEP_SUMMARY
            echo '# Start with Docker Compose (production-ready)' >> $GITHUB_STEP_SUMMARY
            echo 'cd docker' >> $GITHUB_STEP_SUMMARY
            echo '# Configure a provider API key in .env and map LLM_MODEL_1_ID' >> $GITHUB_STEP_SUMMARY
            echo '# to its configured text model before startup (required; no default).' >> $GITHUB_STEP_SUMMARY
            echo '# LLM_MODEL_1_NAME is optional; an empty name displays the configured model ID.' >> $GITHUB_STEP_SUMMARY
            echo 'docker compose -f docker-compose.yml up -d' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo 'Existing installations: complete [Upgrading to numbered models](${{ github.server_url }}/${{ github.repository }}/blob/${{ needs.validate-release.outputs.tag }}/INSTALL_MANUAL.md#upgrading-to-numbered-models) before starting the new API or workers.' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📦 Image Details" >> $GITHUB_STEP_SUMMARY
            echo "- **API Server**: Contains the Flask backend with all business logic" >> $GITHUB_STEP_SUMMARY
            echo "- **Web**: Next.js content management system and unified frontend" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "All images support both **linux/amd64** and **linux/arm64** architectures." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Build Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Please check the build logs for details and retry if necessary." >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "🤖 Release image build for: **${{ needs.validate-release.outputs.tag }}**" >> $GITHUB_STEP_SUMMARY
