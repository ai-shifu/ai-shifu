name: Prettier Check

on:
  pull_request:
    paths:
      - 'src/cook-web/**'
      - '.github/workflows/prettier-check.yml'
  push:
    branches:
      - main
    paths:
      - 'src/cook-web/**'
      - '.github/workflows/prettier-check.yml'

permissions:
  contents: read

concurrency:
  group: prettier-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prettier:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js (match Cook Web engines)
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: src/cook-web/package-lock.json

      - name: Install dependencies
        run: |
          cd src/cook-web
          npm ci

      - name: Check Prettier formatting for changed files
        env:
          PRETTIER_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          PRETTIER_HEAD_SHA: ${{ github.sha }}
        run: |
          cd src/cook-web
          npm run format:check:changed
