name: Docker image metadata
description: Resolve configured registries and publication mode without exporting credentials between jobs
inputs:
  image-name:
    required: true
    description: Repository name in each registry
  tags:
    required: true
    description: Docker metadata tag rules
  labels:
    required: true
    description: OCI labels
  push-images:
    required: true
    description: Whether publication is requested
  require-registry:
    default: 'false'
    description: Fail if publication was requested without a configured registry
outputs:
  push-images:
    value: ${{ steps.registries.outputs.push-images }}
    description: Publication enabled and at least one registry configured
  images:
    value: ${{ steps.registries.outputs.images }}
    description: Comma-separated configured image repositories
  tags:
    value: ${{ steps.meta.outputs.tags }}
    description: Fully qualified image tags
  labels:
    value: ${{ steps.meta.outputs.labels }}
    description: OCI labels
  annotations:
    value: ${{ steps.meta.outputs.annotations }}
    description: OCI annotations
  json:
    value: ${{ steps.meta.outputs.json }}
    description: Structured metadata for manifest publication
runs:
  using: composite
  steps:
    - name: Resolve registries
      id: registries
      shell: bash
      env:
        IMAGE_NAME: ${{ inputs.image-name }}
        REQUESTED_PUSH: ${{ inputs.push-images }}
        REQUIRE_REGISTRY: ${{ inputs.require-registry }}
      run: |
        images=()
        if [ -n "${DOCKERHUB_USER:-}" ] && [ -n "${DOCKERHUB_TOKEN:-}" ]; then
          images+=("${DOCKERHUB_USER}/${IMAGE_NAME}")
        fi
        if [ -n "${ALIYUN_DOCKER_USERNAME:-}" ] && [ -n "${ALIYUN_DOCKER_PASSWORD:-}" ]; then
          images+=("${ALIYUN_DOCKER_REGISTRY}/ai-shifu/${IMAGE_NAME}")
        fi
        push_images="$REQUESTED_PUSH"
        if [ "${#images[@]}" -eq 0 ]; then
          if [ "$push_images" = "true" ] && [ "$REQUIRE_REGISTRY" = "true" ]; then
            echo '::error::Release publication requires at least one configured registry.'
            exit 1
          fi
          if [ "$push_images" = "true" ]; then
            echo '::warning::No registry credentials configured; building both platforms without publication.'
          fi
          push_images=false
          # Metadata still needs a name in credential-free build-only mode.
          images+=("ai-shifu-local/${IMAGE_NAME}")
        fi
        printf -v image_names '%s,' "${images[@]}"
        echo "images=${image_names%,}" >> "$GITHUB_OUTPUT"
        echo "push-images=$push_images" >> "$GITHUB_OUTPUT"

    - name: Extract metadata for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ steps.registries.outputs.images }}
        tags: ${{ inputs.tags }}
        labels: ${{ inputs.labels }}
