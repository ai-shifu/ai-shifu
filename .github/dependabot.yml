version: 2
# Disable routine version PRs while preserving security updates, including major fixes.
# Schedules are required by the schema; security updates run independently.
updates:
  - package-ecosystem: "npm"
    directory: "/src/web"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0

  # This directory includes runtime and CI requirements files.
  - package-ecosystem: "pip"
    directory: "/src/api"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
